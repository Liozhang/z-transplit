<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 96 96">
  <title>Z-Transplit</title>
  <!--
    Z-Transplit 品牌标（2026-09-25 重设计，与 z-search / leadero 同一家族语言）。

    旧标是「深底圆角方 + 双卡片线描插画（A 卡 / 文卡）」，概念对但画法错：
    描边仅 5.6% 视框、内部字形 9 个视觉元素，48px 起字形粘连，24px 以下
    糊成色块，也没有身份字母。新标沿用家族配方「实心墨圆 + 少量粗负形笔画
    + 一个强调色」，一笔一义：

      墨圆  = 原文版面（被翻译的那一页）
      白竖  = 分屏线，从版面顶横垂下，把版面一分为二（split）
      绯红横 = 劈开后顶部的双语对照梁，强调色即译文层（trans）
      整体  = 读作 T，即 TransSplit 的身份字母，避免与 z-search 的
              圆 + Z 撞标

    几何（96 视框，圆心 48/48，半径 34，笔画等粗 9、圆角端）：
      横划 x=28..68、y=34（长 40），竖划 x=48、y=34..64（长 30），
      比例 4:3 的标准 T。横划端头 (23.5,34)/(72.5,34) 距圆边各 6.5，
      竖划收笔 (48,68.5) 距圆底 13.5。包围盒 (23.5,29.5)-(72.5,68.5)
      中心 (48,49)，对圆心唯一偏移 +1 是 T 上重下轻的光学配重。
      绘制顺序刻意为先竖后横：青横盖住白竖顶帽，丁字接口是干净的
      结构交接，不是两色打架。

    配色并入 z-search / leadero 的墨 + 绯红双色系：墨 #1a1a1a 圆、
    纯白 #ffffff 负形竖、绯红 #b5343a 横，弃用旧标的青绿系。
    深色宿主用 ztransplit-dark.svg（浅圆 + 墨竖 + 绯红横）；本文件为
    品牌图，不参与 manifest 与 chrome:// 引用，配色不受 QA S7 约束。
  -->
  <circle cx="48" cy="48" r="34" fill="#1a1a1a"/>
  <path d="M48 34 V64" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M28 34 H68" stroke="#b5343a" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
