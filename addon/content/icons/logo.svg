<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 96 96">
  <title>Z-Transplit</title>
  <!--
    Z-Transplit 品牌标（2026-09-28 比例重排，圆盘与笔画维持本标自有比例）。

    2026-09-25 定稿的造型概念不变，一笔一义：

      墨圆  = 原文版面（被翻译的那一页）
      白竖  = 分屏线，从版面顶横垂下，把版面一分为二（split）
      绯红横 = 劈开后顶部的双语对照梁，强调色即译文层（trans）
      整体  = 读作 T，即 TransSplit 的身份字母

    2026-09-28 比例微调（上一版内部配比失衡，病根有二，均在本标自身几何内）：
      1. 横条被圆边夹住：横端帽与圆边的真实曲线余量仅约 5.1（横向视距
         也只有 6.5），而顶部空腔 15.5、底部 13.5——最挤的方向（左右）
         反而是余量最小的方向，绯红横两端呈被捏住的观感。病因是横条过长
         且位置偏高：y=34 处圆弦半宽 31.0，一条半长 24.5 的横条塞进去，
         端帽必然逼近圆边。
      2. T 形横浓竖淡：横:竖渲染长 49:39 = 1.26，宽于标准 T 的约 1.15，
         字形显矮胖。
    新版只动横条：心线 x=28..68 收短为 30..66（心线长 40→36），位置
    y=34→35 下移 1 单位离开圆边收缩区；竖划心线长 30 不变，圆盘 r=34、
    双划 9 粗一概不动（笔画/圆盘 = 0.132 不变，本标的墨水重量感不受影
    响）。端帽曲线余量 5.1→7.3、横向视距 6.5→8.9，底部空腔 13.5→12.5，
    横:竖 1.26→1.15。

    几何（96 视框，圆心 48/48，半径 34，笔画等粗 9、圆角端）：
      横划 x=30..66、y=35（心线长 36），竖划 x=48、y=35..65（心线长 30），
      横:竖渲染长 45:39 = 1.15 的标准 T。
      墨迹包围盒 (25.5,30.5)-(70.5,69.5)，中心 (48,50)，对圆心偏移 +2 是
      T 上重下轻的光学配重（横条下移 1 后由旧版的 +1 变为 +2）。
      四边余量（墨迹包围盒 vs 圆包围盒 14..82）：左11.5/右11.5/上16.5/下12.5
      ——左右齐平；上大于下是高位横条的固有几何，横端帽的真实曲线余量
      7.3、横向视距 8.9，与上下空腔不再倒挂。
      绘制顺序刻意为先竖后横：绯红横盖住白竖顶帽，丁字接口是干净的
      结构交接，不是两色打架。

    配色：墨 #1a1a1a 圆、纯白 #ffffff 负形竖、绯红 #b5343a 横。深色宿主
    用 ztransplit-dark.svg（浅圆 + 墨竖 + 绯红横）；本文件为品牌图，不参与
    manifest 与 chrome:// 引用，配色不受 QA S7 约束。
  -->
  <circle cx="48" cy="48" r="34" fill="#1a1a1a"/>
  <path d="M48 35 V65" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M30 35 H66" stroke="#b5343a" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
